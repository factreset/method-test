containers:
  - name: app
    dockerfile: app/Dockerfile
    env:
      DATABASE_URL: "postgres://postgres:postgres@host.docker.internal:5433/method_test"
  - name: db
    dockerfile: db/Dockerfile
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: method_test
    volumes:
      - name: pgdata
        mount: /var/lib/postgresql/data

services:
  - name: web
    container: app
    ports:
      - name: http
        port: 3000
  - name: database
    container: db
    ports:
      - name: pg
        port: 5432
        proto: tcp

deploys:
  - name: prod
    services:
      - service: web
        host: localhost
        port: 8080
        target: http
      - service: database
        host: method-test-db.relay
        port: 5433
        target: pg
        proxy: tcp